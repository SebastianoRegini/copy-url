</a>


<script>
document.querySelectorAll(".copy-url").forEach(link => {

    link.addEventListener("click", async function(event) {

        // Non aprire il link
        event.preventDefault();

        const url = this.href;

        try {
            // Copia l'URL nella clipboard
            await navigator.clipboard.writeText(url);

            // Piccolo feedback
            this.textContent = "✓ Copiato";

            // Chiudi la pagina
            setTimeout(() => {
                window.close();

                // Fallback se window.close() viene bloccato
                setTimeout(() => {
                    history.back();
                }, 100);
                
            }, 100);

        } catch (error) {
            console.error("Errore nella copia:", error);
            alert("Impossibile copiare l'URL.");
        }

    });

});
</script>

</body>
