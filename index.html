<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copia URL</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        .box {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
            max-width: 90%;
        }

        button {
            font-size: 18px;
            padding: 14px 25px;
            border: 0;
            border-radius: 10px;
            background: #e44332;
            color: white;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">
    <div id="message">Copiazione in corso...</div>
    <button id="copyButton" style="display:none;">
        COPIA URL
    </button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");

    const message = document.getElementById("message");
    const button = document.getElementById("copyButton");

    async function copyUrl() {
        if (!url) {
            message.textContent = "Nessun URL specificato.";
            return;
        }

        try {
            await navigator.clipboard.writeText(url);
            message.textContent = "✓ URL copiato!";

            // Chiude la pagina dopo mezzo secondo
            setTimeout(() => {
                window.close();

                // Se il browser non permette window.close(),
                // torna alla pagina precedente.
                setTimeout(() => {
                    history.back();
                }, 100);
            }, 500);

        } catch (error) {
            message.textContent = "Premi il pulsante per copiare:";
            button.style.display = "inline-block";
        }
    }

    button.addEventListener("click", copyUrl);

    copyUrl();
</script>

</body>
</html>
