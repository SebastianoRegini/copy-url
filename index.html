<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copia URL</title>
</head>

<body>

<a href="https://youtu.be/5Kz3HbGB1k4" class="copy-url">
    Cervicale stop #1
</a>
<br><br>

<a href="https://youtu.be/XXXXXXXXXXX" class="copy-url">
    Cervicale stop #2
</a>
<br><br>

<a href="https://youtu.be/YYYYYYYYYYY" class="copy-url">
    Cervicale stop #3
</a>
<br><br>

<a href="https://youtu.be/ZZZZZZZZZZZ" class="copy-url">
    Cervicale stop #4
</a>
<br><br>

<a href="https://youtu.be/AAAAAAAAAAA" class="copy-url">
    Cervicale stop #5
</a>
<br><br>

<a href="https://youtu.be/BBBBBBBBBBB" class="copy-url">
    Cervicale stop #6
</a>
<br><br>

<a href="https://youtu.be/CCCCCCCCCCC" class="copy-url">
    Cervicale stop #7
</a>


<script>
document.querySelectorAll(".copy-url").forEach(link => {

    link.addEventListener("click", async function(event) {

        // Non aprire il link
        event.preventDefault();

        const url = this.href;

        try {
            // Copia l'URL nella clipboard
            await navigator.clipboard.writeText(url);

            // Piccolo feedback
            this.textContent = "✓ Copiato";

            // Chiudi la pagina
            setTimeout(() => {
                window.close();

                // Fallback se window.close() viene bloccato
                setTimeout(() => {
                    history.back();
                }, 100);
                
            }, 100);

        } catch (error) {
            console.error("Errore nella copia:", error);
            alert("Impossibile copiare l'URL.");
        }

    });

});
</script>

</body>
</html>
